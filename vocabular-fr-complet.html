<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabular FR</title>
<style>
  :root{
    --maro:#8C2340;
    --label:#8A93A3;
    --text-dark:#1B2430;
    --divider:#E7E9ED;
    --bg-page:#EEF0F3;
    --navy:#16233F;
    --verde:#2E7D4F;
    --verde-bg:#EAF6EE;
    --rosu:#B4302F;
    --rosu-bg:#FBEAEA;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-page);
    padding:16px 16px 100px 16px;
  }
  .wrap{width:100%; max-width:460px; margin:0 auto;}
  .icon{ width:16px; height:16px; display:block; flex-shrink:0; }

  /* ---------- taburi principale ---------- */
  .main-tabs{
    display:flex;
    background:#E2E5EA;
    border-radius:12px;
    padding:4px;
    margin-bottom:16px;
  }
  .main-tabs button{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border:none;
    background:transparent;
    padding:11px 0;
    border-radius:9px;
    font-size:13.5px;
    font-weight:700;
    color:var(--label);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .main-tabs button.active{
    background:#fff;
    color:var(--text-dark);
    box-shadow:0 2px 6px rgba(20,25,40,0.08);
  }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- INSULĂ PLUTITOARE (subsol Listă) ---------- */
  .island-wrap{
    position:fixed;
    left:0; right:0; bottom:18px;
    display:flex;
    justify-content:center;
    z-index:20;
    pointer-events:none;
  }
  .island{
    pointer-events:auto;
    background:rgba(27,36,48,0.92);
    backdrop-filter:blur(6px);
    border-radius:26px;
    box-shadow:0 8px 24px rgba(20,25,40,0.28);
    overflow:hidden;
    transition:width .25s ease, border-radius .25s ease;
    width:100%;
    max-width:428px;
  }
  .island.collapsed{
    width:52px;
    border-radius:50%;
  }
  .island-collapsed-btn{
    width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:#fff; cursor:pointer;
  }
  .island-collapsed-btn svg{ width:20px; height:20px; }
  .island-panel{ display:none; padding:10px 14px 12px 14px; }
  .island.expanded .island-panel{ display:block; }
  .island.expanded .island-collapsed-btn{ display:none; }

  .island-row{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .island-mainbar{ flex-wrap:nowrap; }
  .ghost-btn{
    background:none;
    border:none;
    color:rgba(255,255,255,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:9px 10px;
    border-radius:14px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:background .15s, color .15s;
  }
  .ghost-btn:active{ background:rgba(255,255,255,0.12); }
  .ghost-btn svg{ width:19px; height:19px; flex-shrink:0; }
  .ghost-btn.grow{ flex:1; justify-content:center; }
  .ghost-btn.playing{ color:#8FE0A8; }
  .ghost-btn.icon-only{ width:36px; height:36px; padding:0; flex-shrink:0; }
  .ghost-btn.icon-only.muted{ width:26px; color:rgba(255,255,255,0.4); }
  .ghost-btn.icon-only.muted svg{ width:15px; height:15px; }
  .ghost-btn.text-btn{ font-size:11.5px; padding:8px 8px; flex-shrink:0; white-space:nowrap; }
  .ghost-btn.active{ background:rgba(255,255,255,0.14); color:#fff; }
  .island-search-inline{ flex:1; min-width:0; }
  .island-search-inline input{
    width:100%;
    background:rgba(255,255,255,0.1);
    border:none;
    outline:none;
    border-radius:12px;
    padding:9px 11px;
    color:#fff;
    font-size:13px;
    font-family:inherit;
  }
  .island-search-inline input::placeholder{ color:rgba(255,255,255,0.4); }
  .island-close{
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:rgba(255,255,255,0.6);
    border-radius:50%;
    cursor:pointer;
    flex-shrink:0;
  }
  .island-close:active{ background:rgba(255,255,255,0.12); }
  .island-close svg{ width:16px; height:16px; }

  .island-filter-panel{ display:none; }
  .island-filter-panel.show{ display:block; }

  .island-search{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.08);
    border-radius:14px;
    padding:9px 12px;
  }
  .island-search svg{ width:16px; height:16px; color:rgba(255,255,255,0.6); flex-shrink:0; }
  .island-search input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:#fff;
    font-size:14px;
    font-family:inherit;
  }
  .island-search input::placeholder{ color:rgba(255,255,255,0.45); }

  .island-pills{
    display:none;
    gap:6px;
    overflow-x:auto;
    padding:8px 0 2px 0;
    -webkit-overflow-scrolling:touch;
  }
  .island-pills.show{ display:flex; }
  .island-pills::-webkit-scrollbar{ display:none; }
  .pill-btn{
    flex-shrink:0;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    color:rgba(255,255,255,0.8);
    font-size:12.5px;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .pill-btn.active{ background:#fff; color:var(--navy); border-color:#fff; }

  .island-player{ display:none; align-items:center; gap:4px; }
  .island.is-playing .island-mainbar{ display:none; }
  .island.is-playing .island-player{ display:flex; }
  .island.is-playing .island-pills{ display:none !important; }
  .island.mode-testare .island-pills,
  .island.mode-testare .island-player{ display:none !important; }
  .island-player-label{
    flex:1;
    min-width:0;
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0 4px;
  }
  .island-player-label small{ display:block; font-weight:400; color:rgba(255,255,255,0.55); font-size:10.5px; }

  .card{
    margin-bottom:14px;
    transition:transform .15s;
  }
  .card-body{
    background:#fff;
    border-radius:18px;
    padding:18px 20px;
    border:2px solid transparent;
    box-shadow:0 6px 18px rgba(20,25,40,0.06);
    transition:border-color .2s, box-shadow .2s;
  }
  .card.active .card-body{ border-color:var(--verde); box-shadow:0 6px 20px rgba(46,125,79,0.18); }
  .card.active .mini-btn{ background:var(--verde); }

  .row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .mot-fr{
    font-size:21px;
    font-weight:700;
    color:var(--text-dark);
    display:flex;
    align-items:center;
    gap:9px;
  }
  .mini-btn{
    width:30px; height:30px;
    border-radius:9px;
    border:none;
    background:var(--navy);
    color:#fff;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mini-btn svg{ width:14px; height:14px; }
  .badge{
    min-width:34px; height:34px;
    padding:0 6px;
    border-radius:17px;
    background:#EEF0F3;
    color:var(--label);
    display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700;
    flex-shrink:0;
    cursor:pointer;
    transition:background .2s, color .2s;
    border:none;
    font-family:inherit;
  }
  .card.active .badge{ background:var(--verde); color:#fff; }
  .badge.known{ background:var(--verde); color:#fff; }

  .field-row{
    display:flex;
    gap:10px;
    align-items:baseline;
    margin-bottom:6px;
  }
  .lbl{
    width:34px;
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--label);
  }
  .val{
    font-size:15px;
    color:var(--text-dark);
  }
  .val.pron{ color:var(--maro); font-weight:700; }
  .val.ex{ font-weight:700; }

  .divider-line{
    border:none;
    border-top:1px solid var(--divider);
    margin:12px 0;
  }

  /* ---------- TESTARE ---------- */
  .switch{
    display:flex;
    background:#E2E5EA;
    border-radius:12px;
    padding:4px;
    margin-bottom:14px;
  }
  .switch button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    border-radius:9px;
    font-size:13.5px;
    font-weight:700;
    color:var(--label);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .switch button.active{
    background:#fff;
    color:var(--text-dark);
    box-shadow:0 2px 6px rgba(20,25,40,0.08);
  }

  .card-outer{ display:flex; gap:10px; }
  .accent-bar-q{ width:7px; border-radius:6px; background:var(--maro); flex-shrink:0; transition:background .15s; }
  .card-q{
    flex:1;
    background:#FFFFFF;
    border-radius:20px;
    padding:22px;
    box-shadow:0 8px 24px rgba(20,25,40,0.08);
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .kicker{
    font-size:12px;
    font-weight:700;
    color:var(--label);
    letter-spacing:0.5px;
  }
  .badge-q{
    min-width:42px; height:42px;
    padding:0 6px;
    border-radius:21px;
    border:1.5px solid var(--divider);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:var(--text-dark);
  }

  .prompt-word{
    font-size:26px;
    font-weight:700;
    color:var(--text-dark);
    margin:8px 0 14px 0;
  }

  .listen-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 20px 0;
  }
  .sq-btn{
    width:48px; height:48px;
    border-radius:12px;
    border:none;
    background:var(--navy);
    color:#fff;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .listen-hint{
    font-size:13.5px;
    color:var(--label);
  }

  .hint-toggle{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--maro);
    font-size:13.5px;
    font-weight:600;
    padding:0 0 14px 0;
    cursor:pointer;
  }
  .hint-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--bg-page);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .hint-text{
    font-size:14px;
    color:var(--text-dark);
    line-height:1.4;
  }
  .hint-sq-btn{
    width:38px; height:38px;
    border-radius:10px;
    border:none;
    background:var(--navy);
    color:#fff;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  table{ width:100%; border-collapse:collapse; }
  td{ padding:12px 0; vertical-align:middle; border-bottom:1px solid var(--divider); }
  tr:last-child td{ border-bottom:none; }
  .col-task{ width:38%; padding-right:10px; }
  .col-answer{ width:62%; }
  .task-label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-dark); letter-spacing:0.3px; }
  .task-sub{ display:block; font-size:11.5px; color:var(--label); }
  .ans-input{
    width:100%;
    padding:9px 10px;
    border-radius:9px;
    border:1.5px solid var(--divider);
    font-size:14.5px;
    font-family:inherit;
    outline:none;
  }
  .ans-input:focus{ border-color:var(--navy); }
  .ans-input.correct{ border-color:var(--verde); background:var(--verde-bg); color:var(--verde); font-weight:600; }
  .ans-input.wrong{ border-color:var(--rosu); background:var(--rosu-bg); color:var(--rosu); font-weight:600; }
  .correct-hint{ font-size:12px; margin-top:4px; min-height:14px; }
  .correct-hint.show.ok{ color:var(--verde); }
  .correct-hint.show.no{ color:var(--rosu); }

  .rec-row{ display:flex; align-items:center; gap:8px; }
  .rec-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:var(--rosu);
    color:#fff;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:transform .15s;
  }
  .rec-btn.recording{ animation:pulse 1.2s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(180,48,47,0.45); }
    70%{ box-shadow:0 0 0 9px rgba(180,48,47,0); }
    100%{ box-shadow:0 0 0 0 rgba(180,48,47,0); }
  }
  .rec-play-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:var(--verde);
    color:#fff;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .rec-play-btn:disabled{ background:var(--divider); color:var(--label); cursor:default; }
  .pron-ref{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    font-size:13px;
    color:var(--maro);
    font-weight:700;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:18px;
  }
  .nav-btn{
    width:44px; height:44px;
    border-radius:50%;
    border:1.5px solid var(--divider);
    background:#fff;
    color:var(--text-dark);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .check-btn{
    flex:1;
    max-width:220px;
    padding:13px 0;
    border-radius:12px;
    border:none;
    background:var(--navy);
    color:#fff;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  .score{
    text-align:center;
    margin-top:14px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-dark);
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===================== VIEW: LISTĂ ===================== -->
  <div class="view active" id="view-lista">
    <div id="list"></div>
  </div>

  <!-- ===================== INSULĂ PLUTITOARE (navigare + control listă) ===================== -->
  <div class="island-wrap" id="island-wrap">
    <div class="island collapsed" id="island">
      <button type="button" class="island-collapsed-btn" id="island-open-btn" title="Deschide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
      <div class="island-panel">
        <div class="island-row island-mainbar">
          <div class="island-search-inline">
            <input type="text" id="word-search" placeholder="Caută...">
          </div>
          <button type="button" class="ghost-btn icon-only" id="island-play-btn" title="Redă ce e filtrat">
            <svg id="island-play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5.5v13l11-6.5-11-6.5z"/></svg>
          </button>
          <button type="button" class="ghost-btn icon-only active" id="filter-toggle-btn" title="Categorii">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
          <button type="button" class="ghost-btn text-btn" id="tab-fr-ro" title="Testare FR spre RO">FR→RO</button>
          <button type="button" class="ghost-btn text-btn" id="tab-ro-fr" title="Testare RO spre FR">RO→FR</button>
          <button type="button" class="ghost-btn icon-only muted" id="island-collapse-btn" title="Închide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9l-6 6-6-6"/></svg>
          </button>
        </div>
        <div class="island-pills" id="category-pills"></div>
        <div class="island-row island-player">
          <button type="button" class="ghost-btn" id="island-prev-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <div class="island-player-label" id="island-player-label">
            <small id="island-player-count">1 din 5</small>
            <span id="island-player-word">chantier</span>
          </div>
          <button type="button" class="ghost-btn" id="island-pause-btn">
            <svg id="island-pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>
          </button>
          <button type="button" class="ghost-btn" id="island-next-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button type="button" class="island-close" id="island-stop-btn" title="Oprește">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== VIEW: TESTARE ===================== -->
  <div class="view" id="view-testare">
    <div class="switch">
      <button type="button" class="active" id="btn-fr-ro">FR → RO</button>
      <button type="button" id="btn-ro-fr">RO → FR</button>
    </div>

    <div class="card-outer">
      <div class="accent-bar-q" id="accent-bar-q"></div>
      <div class="card-q">

        <div class="top">
          <div class="kicker" id="kicker">VERIFICARE CUVÂNT</div>
          <div class="badge-q" id="badge">1/5</div>
        </div>

        <div class="prompt-word" id="prompt-word"></div>

        <div class="listen-row">
          <button type="button" class="sq-btn" id="play-word-q" title="Ascultă">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.2 8.8a5 5 0 0 1 0 6.4"/><path d="M18.8 6.2a8.5 8.5 0 0 1 0 11.6"/></svg>
          </button>
          <div class="listen-hint" id="listen-hint">Ascultă, apoi completează cele trei rânduri de mai jos</div>
        </div>

        <button type="button" class="hint-toggle" id="hint-toggle">Arată propoziția ajutătoare</button>
        <div class="hint-box" id="hint-box" style="display:none;">
          <span class="hint-text" id="hint-text"></span>
          <button type="button" class="hint-sq-btn" id="play-hint" title="Ascultă propoziția">
            <svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.2 8.8a5 5 0 0 1 0 6.4"/><path d="M18.8 6.2a8.5 8.5 0 0 1 0 11.6"/></svg>
          </button>
        </div>

        <table>
          <tr>
            <td class="col-task"><span class="task-label" id="label-1">SCRIERE</span><span class="task-sub" id="sub-1">cuvântul în FR</span></td>
            <td class="col-answer"><input type="text" class="ans-input" id="in-1" placeholder=""><div class="correct-hint" id="hint-1"></div></td>
          </tr>
          <tr>
            <td class="col-task"><span class="task-label">PRONUNȚIE</span><span class="task-sub">înregistrează-te</span></td>
            <td class="col-answer">
              <div class="rec-row">
                <button type="button" class="rec-btn" id="rec-btn" title="Înregistrează">
                  <svg class="icon" id="rec-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="7"/></svg>

/* ======================= TTS PARTAJAT ======================= */
/* Vocea de sistem (Web Speech API) — singura variantă stabilă pe iPhone.
   Încercarea cu vocea Google a fost scoasă: Safari o blochează des, fără avertisment. */
let roVoice = null, frVoice = null;
function pickVoices(){
  const voices = speechSynthesis.getVoices();
  roVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ro')) || null;
  frVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
}
if('speechSynthesis' in window){
  pickVoices();
  speechSynthesis.onvoiceschanged = pickVoices;
}
function makeUtterance(text, lang){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.voice = lang.startsWith('fr') ? frVoice : roVoice;
  u.rate = 0.85;
  return u;
}

function stopAllAudio(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(currentAudioEl){
    currentAudioEl.onended = null;
    currentAudioEl.onerror = null;
    currentAudioEl.pause();
    currentAudioEl = null;
  }
}

/* speakText: vorbește cu vocea de sistem; onend e opțional (folosit la redarea în lanț). */
function speakText(text, lang, onend){
  if(!('speechSynthesis' in window)){ onend && onend(); return; }
  const u = makeUtterance(text, lang);
  u.onend = ()=> onend && onend();
  speechSynthesis.speak(u);
}

function speakOne(text, lang){
  stopAllAudio();
  speakText(text, lang);
}

/* ---------- redare fișiere audio reale (generate cu OpenAI), cu rezervă pe vocea de sistem ---------- */
let currentAudioEl = null;

function speakAudioFile(url, fallbackText, fallbackLang, onend){
  if(!url){ speakText(fallbackText, fallbackLang, onend); return; }
  const audio = new Audio(url);
  currentAudioEl = audio;
  const fallback = ()=>{ currentAudioEl = null; speakText(fallbackText, fallbackLang, onend); };
  audio.onended = ()=>{ currentAudioEl = null; onend && onend(); };
  audio.onerror = fallback;
  audio.play().catch(fallback);
}

/* ======================= TABURI PRINCIPALE ======================= */
function goToLista(){
  document.getElementById('filter-toggle-btn').classList.add('active');
  document.getElementById('tab-fr-ro').classList.remove('active');
  document.getElementById('tab-ro-fr').classList.remove('active');
  document.getElementById('view-lista').classList.add('active');
  document.getElementById('view-testare').classList.remove('active');
  document.getElementById('island').classList.remove('mode-testare');
  speechSynthesis.cancel();
  stopPlayback();
  if(typeof resetRecording === 'function') resetRecording();
}
function goToTestare(testMode){
  document.getElementById('filter-toggle-btn').classList.remove('active');
  document.getElementById('tab-fr-ro').classList.toggle('active', testMode === 'fr-ro');
  document.getElementById('tab-ro-fr').classList.toggle('active', testMode === 'ro-fr');
  document.getElementById('view-testare').classList.add('active');
  document.getElementById('view-lista').classList.remove('active');
  document.getElementById('island').classList.add('mode-testare');

}
document.getElementById('filter-toggle-btn').addEventListener('click', ()=>{

});
document.getElementById('tab-fr-ro').addEventListener('click', ()=> goToTestare('fr-ro'));
document.getElementById('tab-ro-fr').addEventListener('click', ()=> goToTestare('ro-fr'));

/* ======================= VIEW: LISTĂ ======================= */
const listEl = document.getElementById('list');
const speakerSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/></svg>';
const playSvg  = '<svg id="island-play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5.5v13l11-6.5-11-6.5z"/></svg>';
const pauseSvg = '<svg id="island-pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>';

function normalizeSearch(s){
  return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

/* ---------- cuvinte știute (persistate în browser) ---------- */
let knownWords = new Set();
try{
  const saved = JSON.parse(localStorage.getItem('vocab-known-fr') || '[]');
  knownWords = new Set(saved);
}catch(e){}
function saveKnownWords(){
  try{ localStorage.setItem('vocab-known-fr', JSON.stringify([...knownWords])); }catch(e){}
}

cuvinte.forEach((c, i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+i;
  card.dataset.searchKey = normalizeSearch(c.mot + ' ' + c.trad);
  card.dataset.category = c.categorie;
  card.innerHTML = `
    <div class="card-body">
      <div class="row-top">
        <div class="mot-fr">${c.mot}<button type="button" class="mini-btn" data-play="mot-${i}">${speakerSvg}</button></div>
        <button type="button" class="badge" id="badge-${i}" data-known-toggle="${i}" title="Marchează ca știut"></button>
      </div>
      ${c.pron ? `<div class="field-row"><span class="lbl">PR</span><span class="val pron">${c.pron}</span></div>` : ''}
      <div class="field-row"><span class="lbl">RO</span><span class="val">${c.trad}</span></div>
      <hr class="divider-line">
      <div class="field-row"><span class="lbl">EFR</span><span class="val ex">${c.ex_fr}</span><button type="button" class="mini-btn" data-play="ex-${i}" style="margin-left:4px;">${speakerSvg}</button></div>
      ${c.pron_ex ? `<div class="field-row"><span class="lbl">PRE</span><span class="val pron">${c.pron_ex}</span></div>` : ''}
      <div class="field-row"><span class="lbl">ERO</span><span class="val">${c.ex_ro}</span></div>
    </div>
  `;
  listEl.appendChild(card);
});
renumberBadges();

function renumberBadges(){
  const visible = getVisibleIndices();
  visible.forEach((wordIdx, pos)=>{
    const badge = document.getElementById('badge-'+wordIdx);
    badge.textContent = `${pos+1}/${visible.length}`;
    badge.classList.toggle('known', knownWords.has(wordIdx));
  });
}

document.getElementById('list').addEventListener('click', (e)=>{
  const knownBtn = e.target.closest('[data-known-toggle]');
  if(knownBtn){
    const i = Number(knownBtn.dataset.knownToggle);
    if(knownWords.has(i)) knownWords.delete(i); else knownWords.add(i);
    saveKnownWords();
    renumberBadges();
    applyFilters();
    return;
  }
  const btn = e.target.closest('.mini-btn');
  if(!btn) return;
  const [type, i] = btn.dataset.play.split('-');
  const c = cuvinte[i];
  const text = type === 'mot' ? c.mot : c.ex_fr;
  if(!playing){
    setActiveCard(Number(i));
    speakText(text, 'fr-FR', ()=> setActiveCard(-1));
  } else {
    speakOne(text, 'fr-FR');
  }
});

document.getElementById('word-search').addEventListener('input', ()=>{
  if(!document.getElementById('view-lista').classList.contains('active')) goToLista();
  applyFilters();
});

let activeCategory = 'Toate';

function applyFilters(){
  const q = normalizeSearch(document.getElementById('word-search').value);
  document.querySelectorAll('#list .card').forEach(card=>{
    const idx = Number(card.id.split('-')[1]);
    const matchesSearch = !q || card.dataset.searchKey.includes(q);
    let matchesCategory;
    if(activeCategory === 'Toate') matchesCategory = true;
    else if(activeCategory === 'De învățat') matchesCategory = !knownWords.has(idx);
    else if(activeCategory === 'Știute') matchesCategory = knownWords.has(idx);
    else matchesCategory = card.dataset.category === activeCategory;
    card.style.display = (matchesSearch && matchesCategory) ? '' : 'none';
  });
  renumberBadges();
}

const categoriiUnice = ['Toate', 'De învățat', 'Știute', ...new Set(cuvinte.map(c => c.categorie).filter(Boolean))];
const pillsEl = document.getElementById('category-pills');
categoriiUnice.forEach(cat=>{
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pill-btn' + (cat === 'Toate' ? ' active' : '');
  btn.textContent = cat;
  btn.dataset.cat = cat;
  pillsEl.appendChild(btn);
});
pillsEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.pill-btn');
  if(!btn) return;
  activeCategory = btn.dataset.cat;
  pillsEl.querySelectorAll('.pill-btn').forEach(b => b.classList.toggle('active', b === btn));
  applyFilters();
});

let playing = false;
let currentWordIdx = -1;
let playQueue = [];
let playPos = 0;

function setActiveCard(i){
  document.querySelectorAll('#list .card').forEach(el => el.classList.remove('active'));
  if(i >= 0){
    const el = document.getElementById('card-'+i);
    el.classList.add('active');
    el.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

function getVisibleIndices(){
  return cuvinte.map((_,i)=>i).filter(i=>{
    const card = document.getElementById('card-'+i);
    return card && card.style.display !== 'none';
  });
}

function buildQueueForWord(i){
  const c = cuvinte[i];
  return [
    { audio:c.audio_fr, text:c.mot + '. ' + c.ex_fr, lang:'fr-FR' },
    { audio:c.audio_ro, text:c.trad + '. ' + c.ex_ro, lang:'ro-RO' }
  ];
}

function playSegments(items, idx, onAllDone){
  if(idx >= items.length){ onAllDone && onAllDone(); return; }
  const {audio, text, lang} = items[idx];
  speakAudioFile(audio, text, lang, ()=> playSegments(items, idx+1, onAllDone));
}

function updatePlayerLabel(pos){
  document.getElementById('island-player-count').textContent = `${pos+1} din ${playQueue.length}`;
  document.getElementById('island-player-word').textContent = cuvinte[playQueue[pos]].mot;
}

function playAtPos(pos){
  if(pos >= playQueue.length){ stopPlayback(); return; }
  playPos = pos;
  const wordIdx = playQueue[pos];
  currentWordIdx = wordIdx;
  setActiveCard(wordIdx);
  updatePlayerLabel(pos);
  playSegments(buildQueueForWord(wordIdx), 0, ()=>{ if(playing) playAtPos(pos+1); });
}

function setIslandPlayIcon(iconSvg){
  const el = document.getElementById('island-pause-icon') || document.getElementById('island-play-icon');
  if(el) el.outerHTML = iconSvg;
}

function startPlayback(){
  playQueue = getVisibleIndices();
  if(playQueue.length === 0) return;
  playing = true;
  document.getElementById('island').classList.add('is-playing');
  setIslandPlayIcon(pauseSvg);
  playAtPos(0);
}
function pausePlayback(){
  playing = false;
  if('speechSynthesis' in window && speechSynthesis.speaking) speechSynthesis.pause();
  if(currentAudioEl) currentAudioEl.pause();
  setIslandPlayIcon(playSvg);
}
function resumePlayback(){
  playing = true;
  if('speechSynthesis' in window && speechSynthesis.paused) speechSynthesis.resume();
  if(currentAudioEl) currentAudioEl.play().catch(()=>{});
  setIslandPlayIcon(pauseSvg);
}
function stopPlayback(){
  playing = false;
  currentWordIdx = -1;
  playQueue = [];
  stopAllAudio();
  setActiveCard(-1);
  document.getElementById('island').classList.remove('is-playing');
  setIslandPlayIcon(playSvg);
}

document.getElementById('island-play-btn').addEventListener('click', ()=>{
  if(!document.getElementById('view-lista').classList.contains('active')) goToLista();
  startPlayback();
});
document.getElementById('island-pause-btn').addEventListener('click', ()=>{
  if(playing) pausePlayback(); else resumePlayback();
});
document.getElementById('island-stop-btn').addEventListener('click', stopPlayback);
document.getElementById('island-prev-btn').addEventListener('click', ()=>{
  const pos = (playPos - 1 + playQueue.length) % playQueue.length;
  playing = true;
  setIslandPlayIcon(pauseSvg);
  playAtPos(pos);
});
document.getElementById('island-next-btn').addEventListener('click', ()=>{
  const pos = (playPos + 1) % playQueue.length;
  playing = true;
  setIslandPlayIcon(pauseSvg);
  playAtPos(pos);
});

document.getElementById('island-open-btn').addEventListener('click', ()=>{

/* ---------- înregistrare pronunție proprie ---------- */
const recCircleSvg = '<svg class="icon" id="rec-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="7"/></svg>';
const recSquareSvg = '<svg class="icon" id="rec-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>';

let mediaRecorder = null;
let recordedChunks = [];
let recordedAudioUrl = null;
let isRecording = false;

function resetRecording(){
  if(isRecording && mediaRecorder){
    try{ mediaRecorder.stop(); }catch(e){}
  }
  if(recordedAudioUrl){ URL.revokeObjectURL(recordedAudioUrl); recordedAudioUrl = null; }
  recordedChunks = [];
  isRecording = false;
  document.getElementById('rec-btn').innerHTML = recCircleSvg;
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-play-btn').disabled = true;
  const status = document.getElementById('rec-status');
  status.textContent = 'Nicio înregistrare';
  status.className = 'correct-hint';
}

async function toggleRecording(){
  const status = document.getElementById('rec-status');
  if(isRecording){
    mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent = '⚠ Microfonul nu e disponibil în acest browser.';
    status.className = 'correct-hint show no';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recordedChunks = [];
    const preferredType = ['audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    mediaRecorder = preferredType ? new MediaRecorder(stream, { mimeType: preferredType }) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const mimeType = mediaRecorder.mimeType || 'audio/mp4';
      const blob = new Blob(recordedChunks, { type: mimeType });
      if(recordedAudioUrl) URL.revokeObjectURL(recordedAudioUrl);
      recordedAudioUrl = URL.createObjectURL(blob);
      document.getElementById('rec-play-btn').disabled = false;
      status.textContent = '✓ Înregistrare gata — apasă ▶ ca s-o asculți';
      status.className = 'correct-hint show ok';
      stream.getTracks().forEach(t => t.stop());
      isRecording = false;
      document.getElementById('rec-btn').innerHTML = recCircleSvg;
      document.getElementById('rec-btn').classList.remove('recording');
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('rec-btn').innerHTML = recSquareSvg;
    document.getElementById('rec-btn').classList.add('recording');
    status.textContent = '● Se înregistrează... apasă din nou ca să oprești';
    status.className = 'correct-hint';
  } catch(err){
    status.textContent = '⚠ Nu am acces la microfon (verifică permisiunile telefonului sau deschide fișierul direct în browser, nu în preview).';
    status.className = 'correct-hint show no';
  }
}

function playRecording(){
  if(!recordedAudioUrl) return;
  new Audio(recordedAudioUrl).play();
}

document.getElementById('rec-btn').addEventListener('click', toggleRecording);
document.getElementById('rec-play-btn').addEventListener('click', playRecording);

const modes = {
  'fr-ro': {
    kicker: 'VERIFICARE CUVÂNT · FR → RO',
    accent: 'var(--maro)',
    promptField: 'mot',
    promptLang: 'fr-FR',
    listenHint: 'Ascultă cuvântul în franceză, apoi completează',
    hintToggleLabel: 'Arată propoziția ajutătoare',
    hintField: 'ex_fr',
    hintLang: 'fr-FR',
    rows: [
      { id:1, field:'mot',  label:'SCRIERE',    sub:'cuvântul în FR',   ph:'ex: réseau' },
      { id:3, field:'trad', label:'TRADUCERE',  sub:'în română',        ph:'ex: rețea' }
    ]
  },
  'ro-fr': {
    kicker: 'VERIFICARE CUVÂNT · RO → FR',
    accent: 'var(--navy)',
    promptField: 'trad',
    promptLang: 'ro-RO',
    listenHint: 'Ascultă cuvântul în română, apoi scrie echivalentul francez',
    hintToggleLabel: 'Arată propoziția ajutătoare (RO)',
    hintField: 'ex_ro',
    hintLang: 'ro-RO',
    rows: [
      { id:1, field:'mot', label:'SCRIERE', sub:'cuvântul în FR', ph:'ex: réseau' }
    ]
  }
};

let mode = 'fr-ro';
let idx = 0;
let checked = false;
let totalScore = 0;
let scoredWords = new Set();

function pad(){ return `${idx+1}/${cuvinte.length}`; }

function applyModeChrome(){
  const m = modes[mode];
  document.getElementById('kicker').textContent = m.kicker;
  document.getElementById('accent-bar-q').style.background = m.accent;
  document.getElementById('listen-hint').textContent = m.listenHint;
  document.getElementById('hint-toggle').textContent = m.hintToggleLabel;
  const row3 = m.rows.find(r => r.id === 3);
  document.getElementById('row-3').style.display = row3 ? '' : 'none';
  m.rows.forEach(row=>{
    document.getElementById('label-'+row.id).textContent = row.label;
    document.getElementById('sub-'+row.id).textContent = row.sub;
    document.getElementById('in-'+row.id).placeholder = row.ph;
  });
}

function renderCard(){
  const m = modes[mode];
  const c = cuvinte[idx];
  document.getElementById('badge').textContent = pad();
  document.getElementById('prompt-word').textContent = c[m.promptField];
  document.getElementById('hint-text').textContent = c[m.hintField];
  document.getElementById('hint-box').style.display = 'none';
  document.getElementById('hint-toggle').textContent = m.hintToggleLabel;
  [1,3].forEach(i=>{
    const input = document.getElementById('in-'+i);
    input.value = '';
    input.className = 'ans-input';
    input.disabled = false;
    const hint = document.getElementById('hint-'+i);
    hint.className = 'correct-hint';
    hint.textContent = '';
  });
  resetRecording();
  document.getElementById('pron-ref').style.display = 'none';
  document.getElementById('check-btn').textContent = 'VERIFICĂ';
  checked = false;
}

function normalize(s){
  return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function checkField(i, correctValue){
  const input = document.getElementById('in-'+i);
  const hint = document.getElementById('hint-'+i);
  const ok = normalize(input.value) === normalize(correctValue);
  input.className = 'ans-input ' + (ok ? 'correct' : 'wrong');
  input.disabled = true;
  hint.classList.add('show', ok ? 'ok' : 'no');
  hint.textContent = ok ? '✓ corect' : `✗ corect: ${correctValue}`;
  return ok;
}

let maxScoreSoFar = 0;

document.getElementById('check-btn').addEventListener('click', ()=>{
  const m = modes[mode];
  const c = cuvinte[idx];
  if(!checked){
    let correctCount = 0;
    m.rows.forEach(row=>{ if(checkField(row.id, c[row.field])) correctCount++; });
    const scoreKey = mode+'-'+idx;
    if(!scoredWords.has(scoreKey)){
      totalScore += correctCount;
      maxScoreSoFar += m.rows.length;
      scoredWords.add(scoreKey);
    }
    document.getElementById('score').textContent = `Scor total: ${totalScore} / ${maxScoreSoFar}`;
    if(c.pron){
      document.getElementById('pron-ref-text').textContent = c.pron;
      document.getElementById('pron-ref').style.display = 'flex';
    } else {
      document.getElementById('pron-ref').style.display = 'none';
    }
    checked = true;
    document.getElementById('check-btn').textContent = (idx === cuvinte.length-1) ? 'GATA' : 'URMĂTORUL';
  } else {
    if(idx < cuvinte.length - 1){ idx++; renderCard(); }
  }
});

document.getElementById('play-pron-ref').addEventListener('click', ()=>{
  speakOne(cuvinte[idx].mot, 'fr-FR');
});

document.getElementById('play-word-q').addEventListener('click', ()=>{
  const m = modes[mode];
  speakOne(cuvinte[idx][m.promptField], m.promptLang);
});
document.getElementById('play-hint').addEventListener('click', ()=>{
  const m = modes[mode];
  speakOne(cuvinte[idx][m.hintField], m.hintLang);
});

document.getElementById('hint-toggle').addEventListener('click', ()=>{
  const box = document.getElementById('hint-box');
  const btn = document.getElementById('hint-toggle');
  const m = modes[mode];
  const isHidden = box.style.display === 'none' || box.style.display === '';
  if(isHidden){ box.style.display = 'flex'; btn.textContent = 'Ascunde propoziția'; }
  else { box.style.display = 'none'; btn.textContent = m.hintToggleLabel; }
});

document.getElementById('prev-btn').addEventListener('click', ()=>{
  idx = (idx - 1 + cuvinte.length) % cuvinte.length;
  renderCard();
});
document.getElementById('next-btn').addEventListener('click', ()=>{
  idx = (idx + 1) % cuvinte.length;
  renderCard();
});

function switchMode(newMode){
  if(mode === newMode) return;
  mode = newMode;
  idx = 0;
  document.getElementById('btn-fr-ro').classList.toggle('active', mode==='fr-ro');
  document.getElementById('btn-ro-fr').classList.toggle('active', mode==='ro-fr');
  applyModeChrome();
  renderCard();
}
document.getElementById('btn-fr-ro').addEventListener('click', ()=> switchMode('fr-ro'));
document.getElementById('btn-ro-fr').addEventListener('click', ()=> switchMode('ro-fr'));

applyModeChrome();
renderCard();
</script>
